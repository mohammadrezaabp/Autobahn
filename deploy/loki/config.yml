# Loki as one process with everything on the loki-data volume: the log store behind Grafana's
# Autobahn Logs dashboard. Started with -config.expand-env=true, so ${VAR:-default} is read from the
# container environment (docker-compose.yml passes MONITORING_RETENTION).

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # How long a log line is kept. The compactor below is what deletes; without it this is only a
  # number. Must be a whole number of days (the index period).
  retention_period: ${MONITORING_RETENTION:-60d}
  # A container restarted after a long stop replays its old output; a week of it is accepted.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  # Chunks past retention are removed this long after they are marked, not at once.
  retention_delete_delay: 2h

analytics:
  reporting_enabled: false
