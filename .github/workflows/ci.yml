name: Autobahn CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Gateway imports compute components; both dependency trees must exist before typechecking.
      - run: npm ci --ignore-scripts --prefix src/Autobahn.Admin.Web
      - run: npm ci --ignore-scripts --prefix src/Autobahn.Fleet.Web
      - run: npm run typecheck && npm test && npm audit --audit-level=low && npm run build
        working-directory: src/Autobahn.Admin.Web
      - run: npm run typecheck && npm test && npm audit --audit-level=low && npm run build
        working-directory: src/Autobahn.Fleet.Web
  dotnet:
    name: .NET tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix src/Autobahn.Admin.Web
      - run: npm ci --ignore-scripts --prefix src/Autobahn.Fleet.Web
      - run: npm run build --prefix src/Autobahn.Admin.Web && npm run build --prefix src/Autobahn.Fleet.Web
      - name: Restore and audit all dependency levels
        run: dotnet restore Autobahn.sln -p:NuGetAudit=true -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1900;NU1901;NU1902;NU1903;NU1904'
      - run: dotnet build Autobahn.sln -c Release --no-restore
      - run: dotnet run --project tools/Autobahn.CodeStyle -c Release --no-build -- .
      - run: dotnet test Autobahn.sln -c Release --no-build --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dotnet-test-results
          path: artifacts/test-results
          retention-days: 7
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix src/Autobahn.Admin.Web
      - run: npm ci --ignore-scripts --prefix src/Autobahn.Fleet.Web
      - run: npm run build --prefix src/Autobahn.Admin.Web && npm run build --prefix src/Autobahn.Fleet.Web
      - run: dotnet build Autobahn.sln -c Release
      - run: npx playwright install --with-deps chromium
        working-directory: src/Autobahn.Admin.Web
      - run: npm run test:e2e
        working-directory: src/Autobahn.Admin.Web
        env:
          ADMIN_E2E_CONFIGURATION: Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-report
          path: src/Autobahn.Admin.Web/playwright-report
          retention-days: 7
